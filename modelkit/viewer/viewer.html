<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vehicle</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #0e1010;
    --plate: rgba(34, 38, 36, 0.9);
    --edge: rgba(236, 235, 226, 0.12);
    --ink: #ecebe2;
    --muted: #a3a898;
    --lit: #ffc23d;
    --label: "Arial Narrow", "Roboto Condensed", "Liberation Sans Narrow", sans-serif;
    --body: "Segoe UI", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font: 15px/1.4 var(--body); overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: flex-start; padding: 14px 16px; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .top { top: 0; }
  .bottom { bottom: 0; align-items: flex-end; justify-content: flex-start; }
  .plate { background: var(--plate); border: 1px solid var(--edge); border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
  .id { padding: 10px 16px; max-width: 32rem; }
  h1 { margin: 0; font: 700 21px/1.1 var(--label); letter-spacing: 0.06em; text-transform: uppercase; }
  .id p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; align-items: center; }
  .cap { flex-basis: 100%; margin: 0 0 1px 4px; font: 700 10.5px/1 var(--label); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  button { font: 700 13.5px/1 var(--label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: linear-gradient(180deg, #2f3336, #1f2224); border: 1px solid #0a0b0b; border-radius: 3px; padding: 10px 12px 9px; cursor: pointer; }
  button:hover { color: #fff; }
  button:focus-visible { outline: 2px solid var(--lit); outline-offset: 2px; }
  button[aria-pressed="true"] { color: var(--lit); background: linear-gradient(180deg, #2a2618, #1a1810); }
  label.slider { display: flex; align-items: center; gap: 8px; font: 700 12px var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 0 6px; }
  input[type="range"] { width: 120px; accent-color: var(--lit); }
  #status { padding: 9px 14px; font-size: 13px; color: var(--muted); max-width: 26rem; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font: 700 15px var(--label); letter-spacing: 0.14em; text-transform: uppercase; }
  @media (max-width: 620px) { .id { flex: 1 1 100%; } button { padding: 9px 10px 8px; } input[type="range"] { width: 90px; } }
</style>
</head>
<body>
<canvas id="view" aria-label="3D view of the vehicle. Drag to orbit, scroll or pinch to zoom."></canvas>
<header class="hud top">
  <div class="id plate">
    <h1 id="title">Vehicle</h1>
    <p id="blurb">At 1:1. Drag to orbit, scroll to zoom.</p>
  </div>
  <div class="group plate">
    <span class="cap">View</span>
    <button data-view="front">Front</button>
    <button data-view="side">Side</button>
    <button data-view="rear">Rear</button>
    <button data-view="top">Top</button>
  </div>
</header>
<footer class="hud bottom" id="controls">
  <div id="status" class="plate" aria-live="polite">Loading…</div>
</footer>
<div id="loading">Loading…</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="viewer.js"></script>
</body>
</html>
