<!doctype html>
<html lang="en" data-fable="mono">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, user-scalable=no">
<meta name="theme-color" content="#050506">
<meta name="description" content="Fable One Remote: talk to Fable One on your PC from your phone.">
<title>Fable One</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  /* Black and white by default; the menu switches to White, Blue or Paper. */
  :root, :root[data-fable="mono"] {
    color-scheme: dark;
    --ground: #030304; --glass: rgba(18, 18, 22, .78); --glass-strong: rgba(12, 12, 16, .86); --ink: #f4f4f1; --muted: #8e8e8a;
    --line: rgba(255, 255, 255, .1); --accent: #f4f4f1; --accent-ink: #030304; --danger: #ff5a52; --ok: #7ee2a8;
    --orb-core: #f2f2ef; --orb-rim: #ffffff; --orb-glow-color: #cfe0ff;
  }
  :root[data-fable="light"] {
    color-scheme: light;
    --ground: #eeeeea; --glass: rgba(255, 255, 255, .82); --glass-strong: rgba(255, 255, 255, .9); --ink: #0b0b0b; --muted: #5d5d59;
    --line: rgba(0, 0, 0, .09); --accent: #0b0b0b; --accent-ink: #f4f4f1; --danger: #c62828; --ok: #1b8a4b;
    --orb-core: #111111; --orb-rim: #2a2a28; --orb-glow-color: #444444;
  }
  :root[data-fable="blue"] {
    color-scheme: dark;
    --ground: #02050c; --glass: rgba(10, 18, 36, .8); --glass-strong: rgba(8, 14, 30, .88); --ink: #e8efff; --muted: #7f93b8;
    --line: rgba(120, 160, 255, .14); --accent: #4c8dff; --accent-ink: #02050c; --danger: #ff6b6b; --ok: #6fe0a6;
    --orb-core: #4c8dff; --orb-rim: #bcd4ff; --orb-glow-color: #4c8dff;
  }
  :root[data-fable="paper"] {
    color-scheme: light;
    --ground: #f3eee5; --glass: rgba(255, 251, 244, .84); --glass-strong: rgba(255, 251, 244, .92); --ink: #1f1e1c; --muted: #6f6a61;
    --line: rgba(60, 40, 20, .1); --accent: #d97757; --accent-ink: #ffffff; --danger: #b3261e; --ok: #2f7d4f;
    --orb-core: #d97757; --orb-rim: #1f1e1c; --orb-glow-color: #d97757;
  }
  :root { --sans: "Google Sans", Roboto, "Segoe UI", system-ui, sans-serif; --mono: "Roboto Mono", ui-monospace, monospace; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); overscroll-behavior: none; }
  body { font: 16px/1.5 var(--sans); overflow: hidden; user-select: none; -webkit-user-select: none; }
  button, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  /* Tinted glass without a live blur: blurring what's behind means redoing it
     every frame over a moving 3D scene, which is what made phones lag. */
  .glass { background: linear-gradient(180deg, color-mix(in srgb, var(--glass-strong) 92%, white 3%), var(--glass-strong)); border: 1px solid var(--line); }

  /* The scene fills the phone; everything else floats on it. */
  /* Full screen, and the same size while the keyboard slides in and out. */
  #orb { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100lvh; display: block; touch-action: none; }
  #orb-fallback {
    position: fixed; left: 50%; top: 36%; width: 52vw; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, var(--orb-rim), var(--orb-core) 42%, var(--ground) 76%);
    box-shadow: 0 0 90px color-mix(in srgb, var(--orb-glow-color) 35%, transparent);
  }

  .app { position: fixed; inset: 0; display: flex; flex-direction: column; pointer-events: none; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .app > * { pointer-events: auto; }
  .top { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 7px 13px 7px 11px; border-radius: 999px; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status[data-state="online"] i { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
  .status[data-state="offline"] i, .status[data-state="relay-down"] i { background: var(--danger); }
  .status[data-state="connecting"] i { animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .top .spacer { flex: 1; }
  .icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
  .icon svg { width: 20px; height: 20px; }

  /* The open space is the scene: hold the orb to talk. */
  .stage { flex: 1; pointer-events: none; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; }
  .hint { font: 600 11.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 7px 14px; border-radius: 999px; transition: opacity .4s; }
  .hint.live { color: var(--ink); border-color: color-mix(in srgb, var(--danger) 60%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 18%, transparent); }

  /* The latest exchange, on a glass card that tilts with the phone. */
  .deck { perspective: 900px; padding: 0 14px; }
  .card {
    position: relative; border-radius: 26px; padding: 14px 16px 16px; max-height: 34dvh; overflow: hidden; cursor: pointer;
    transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)); transform-style: preserve-3d; transition: transform .15s ease-out;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .07);
    will-change: transform;
  }
  /* A light that runs round the card's edge while Fable One works. */
  .card::before {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
    background: conic-gradient(from var(--spin, 0deg), transparent 0 70%, color-mix(in srgb, var(--orb-glow-color) 85%, white) 85%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0; transition: opacity .3s;
  }
  .card.working::before { opacity: 1; animation: spin 1.6s linear infinite; }
  @property --spin { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --spin: 360deg; } }
  .card .asked { font-size: 13px; color: var(--muted); margin: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .asked b { color: var(--ink); font-weight: 600; }
  .card .answer { font-size: 18.5px; line-height: 1.42; letter-spacing: -.005em; white-space: pre-wrap; word-wrap: break-word; max-height: calc(34dvh - 70px); overflow-y: auto; user-select: text; -webkit-user-select: text; }
  .card .answer.fresh { animation: rise .4s cubic-bezier(.2, .8, .2, 1) both; }
  .confirm { display: flex; gap: 8px; margin-top: 12px; }
  .confirm button { flex: 1; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: transparent; font-weight: 600; cursor: pointer; transition: transform .12s; }
  .confirm button:active { transform: scale(.96); }
  .confirm #confirm-yes { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .card .foot span:last-child { font: 600 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .typing { display: inline-flex; gap: 5px; padding: 6px 0 2px; }
  .typing b { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); opacity: .45; animation: bounce 1.1s infinite; }
  .typing b:nth-child(2) { animation-delay: .15s; }
  .typing b:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 30% { transform: translateY(-6px); opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } }

  /* One-tap commands: real things Fable One on the PC does. */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 14px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 9px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; transition: transform .12s; }
  .chip:active { transform: scale(.94); }

  /* The chat box, docked for the thumb. */
  .dock { padding: 10px 12px 12px; }
  .box { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: end; padding: 6px 6px 6px 18px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
  .box:focus-within { border-color: color-mix(in srgb, var(--orb-glow-color) 40%, var(--line)); }
  #input { resize: none; border: 0; outline: 0; background: transparent; padding: 11px 0; max-height: 110px; min-height: 26px; line-height: 1.4; user-select: text; -webkit-user-select: text; }
  #input::placeholder { color: var(--muted); }
  .round { width: 48px; height: 48px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: transparent; transition: transform .12s ease, background .2s ease; }
  .round:active { transform: scale(.9); }
  .round svg { width: 22px; height: 22px; }
  .round.send { background: var(--accent); color: var(--accent-ink); }
  .round.send:disabled { opacity: .3; }
  .round.live { background: var(--danger); color: #fff; animation: glow 1.1s infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--danger) 25%, transparent); } }

  /* Sheets: history, pairing, menu. */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 10; animation: fade .2s both; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; border-radius: 28px 28px 0 0; padding: 10px 18px calc(20px + env(safe-area-inset-bottom)); background: var(--glass-strong); border-top: 1px solid var(--line); animation: up .32s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes up { from { transform: translateY(100%); } }
  .grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
  .sheet h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }
  .sheet p { margin: 6px 0 12px; color: var(--muted); font-size: 14.5px; }
  #history { height: 82dvh; display: flex; flex-direction: column; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 6px 2px 10px; user-select: text; -webkit-user-select: text; }
  .msg { max-width: 84%; padding: 10px 14px; border-radius: 20px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
  .msg.fable { align-self: flex-start; background: var(--glass); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .msg.note { align-self: center; max-width: 92%; color: var(--muted); font-size: 13px; text-align: center; padding: 4px 8px; }
  .msg.error { border-color: color-mix(in srgb, var(--danger) 55%, transparent); }
  .msg time { display: block; font-size: 11px; opacity: .55; margin-top: 3px; }
  .field { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--ground); font: 600 18px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; text-align: center; user-select: text; -webkit-user-select: text; }
  .wide { width: 100%; margin-top: 10px; padding: 15px; border-radius: 16px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }
  .wide.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .wide.danger { background: transparent; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); }
  .result { min-height: 1.4em; margin-top: 10px; font-size: 14px; text-align: center; }
  .result.bad { color: var(--danger); }
  .result.ok { color: var(--ok); }
  .themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0 4px; }
  .themes button { padding: 11px 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--ground); font-size: 13px; cursor: pointer; }
  .themes button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .caps { font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
  @media (prefers-reduced-motion: reduce) { .card, .sheet, .scrim, .card .answer.fresh { animation: none !important; transition: none; } }
</style>
</head>
<body>
<canvas id="orb" aria-label="Fable One. Hold to talk."></canvas>
<div id="orb-fallback" hidden></div>

<div class="app">
  <header class="top">
    <span class="status glass" id="status" data-state="connecting"><i></i><span id="status-text">Connecting...</span></span>
    <span class="spacer"></span>
    <button class="icon glass" id="open-history" type="button" aria-label="Conversation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
    </button>
    <button class="icon glass" id="menu" type="button" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </header>

  <div class="stage"><span class="hint glass" id="hint">Hold the orb to talk</span></div>

  <div class="deck">
    <section class="card glass" id="card" aria-live="polite">
      <p class="asked" id="asked"></p>
      <div class="answer" id="answer"></div>
      <div class="confirm" id="confirm" hidden>
        <button type="button" id="confirm-yes">Go ahead</button>
        <button type="button" id="confirm-no">Cancel</button>
      </div>
      <div class="foot"><span id="card-time"></span><span>Swipe up for history</span></div>
    </section>
  </div>

  <div class="chips" id="chips"></div>

  <form class="dock" id="composer" autocomplete="off">
    <div class="box glass">
      <textarea id="input" rows="1" placeholder="Message Fable One" enterkeyhint="send"></textarea>
      <button class="round" id="mic" type="button" aria-label="Talk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="round send" id="send" type="submit" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="history" hidden aria-label="Conversation">
  <div class="grip"></div>
  <h2>Conversation</h2>
  <div id="log"></div>
  <button class="wide ghost" id="close-history" type="button">Close</button>
</section>

<section class="sheet" id="pair" hidden aria-label="Pair with your PC">
  <div class="grip"></div>
  <h2>Pair with your PC</h2>
  <p>This app talks to Fable One on your computer, end to end encrypted. Enter your pairing code once, or open your pairing link.</p>
  <input class="field" id="code" placeholder="XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" spellcheck="false" autocomplete="off">
  <button class="wide" id="pair-go" type="button">Pair</button>
  <div class="result" id="pair-result"></div>
</section>

<section class="sheet" id="sheet" hidden aria-label="Menu">
  <div class="grip"></div>
  <h2>Fable One Remote</h2>
  <p id="sheet-host">Talking to Fable One on your PC.</p>
  <div class="caps">Theme</div>
  <div class="themes" id="themes">
    <button type="button" data-theme="mono">Black</button>
    <button type="button" data-theme="light">White</button>
    <button type="button" data-theme="blue">Blue</button>
    <button type="button" data-theme="paper">Paper</button>
  </div>
  <button class="wide ghost" id="clear" type="button">Clear chat</button>
  <button class="wide danger" id="unpair" type="button">Unpair this phone</button>
  <button class="wide ghost" id="close-sheet" type="button">Done</button>
</section>

<script src="js/three.min.js"></script>
<script src="js/util.js"></script>
<script src="js/scene.js"></script>
<script src="js/relay.js"></script>
<script src="js/remote.js"></script>
</body>
</html>
